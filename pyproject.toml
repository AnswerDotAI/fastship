[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastship"
dynamic = ["version"]
description = "Local-first Python project scaffolding and release tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jeremy Howard" }]
keywords = ["release", "pypi", "github", "ghapi", "twine", "versioning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git",
]

dependencies = ["fastcore>=2.3.1"]

[project.optional-dependencies]
docs = ["pyskills>=0.0.38"]
release = [
  "fastship[docs]",
  "ghapi>=2.1.4",
  "fastgit>=0.0.7",
  "build>=1.0.0",
  "twine>=5.0.0",
  "nbdev>=3.3.30",
  "pyyaml>=6.0",
]
all = ["fastship[release]"]
dev = ["fastship[all]", "pytest"]

[project.urls]
Source = "https://github.com/answerdotai/fastship"
Documentation = "https://answerdotai.github.io/fastship/"

[project.scripts]
ship-bump = "fastship.config:ship_bump"
ship-pypi = "fastship.release:ship_pypi"
ship-pages = "fastship.release:ship_pages"
ship-docs = "fastship.docs:ship_docs"
ship-llms = "fastship.docs:ship_llms"
ship-changelog = "fastship.release:ship_changelog"
ship-gh = "fastship.release:ship_release_gh"
ship-release = "fastship.release:ship_release"
ship-new = "fastship.release:ship_new"
ship-rs-new = "fastship.release:ship_rs_new"
ship-crate-new = "fastship.release:ship_crate_new"
ship-pr = "fastship.release:ship_pr"
ship-rs-init = "fastship.release:ship_rs_init"
ship-rs-build = "fastship.release:ship_rs_build"
ship-zig-new = "fastship.release:ship_zig_new"
ship-zig-build = "fastship.release:ship_zig_build"
ship-npm-init = "fastship.release:ship_npm_init"

[tool.setuptools.dynamic]
version = { attr = "fastship.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["fastship"]

[tool.setuptools.package-data]
fastship = ["LICENSE"]
